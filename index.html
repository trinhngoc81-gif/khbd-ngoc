            summary: "Khoảng biến thiên ($R = x_{\\max} - x_{\\min}$), khoảng tứ phân vị ($\\Delta_Q = Q_3 - Q_1$), phương sai ($s^2$), độ lệch chuẩn ($s$) và cách phát hiện giá trị bất thường."
          }
        ]
      }
    ];

    // ==================== TRẠNG THÁI ỨNG DỤNG ====================
    const state = {
      currentLessonId: "bai1",
      currentTab: "theory", // 'theory' | 'types' | 'quiz'
      expandedChapters: { chap1: true, chap2: true, chap3: false, chap4: false, chap5: false },
      searchQuery: "",
      // Lưu trạng thái làm bài tự luyện theo từng lessonId
      quizState: {}
    };

    function getQuizSession(lessonId) {
      if (!state.quizState[lessonId]) {
        state.quizState[lessonId] = {
          part1Answers: {}, // { questionId: selectedOptionIndex }
          part2Answers: {}, // { questionId: stringValue }
          part3Notes: {},   // { questionId: textNote }
          submitted: false,
          scoreInfo: null
        };
      }
      return state.quizState[lessonId];
    }

    // ==================== TIỆN ÍCH RENDER KATEX & TOAST ====================
    function renderMath(container = document.body) {
      if (window.renderMathInElement) {
        renderMathInElement(container, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false },
            { left: "\\(", right: "\\)", display: false },
            { left: "\\[", right: "\\]", display: true }
          ],
          throwOnError: false
        });
      }
    }

    let toastTimeout;
    function showToast(msg) {
      const box = document.getElementById("toast-box");
      const text = document.getElementById("toast-message");
      text.textContent = msg;
      box.classList.remove("translate-y-20", "opacity-0");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        box.classList.add("translate-y-20", "opacity-0");
      }, 3000);
    }

    function findLessonById(lessonId) {
      for (const chap of CURRICULUM_DATA) {
        const found = chap.lessons.find((l) => l.id === lessonId);
        if (found) return { chapter: chap, lesson: found };
      }
      return { chapter: CURRICULUM_DATA[0], lesson: CURRICULUM_DATA[0].lessons[0] };
    }

    // ==================== DARK / LIGHT MODE ====================
    const htmlEl = document.documentElement;
    const themeToggleBtn = document.getElementById("theme-toggle");
    const themeLabel = document.getElementById("theme-label");

    function initTheme() {
      const saved = localStorage.getItem("toan10_theme");
      if (saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        htmlEl.classList.add("dark");
        themeLabel.textContent = "Chế độ sáng";
      } else {
        htmlEl.classList.remove("dark");
        themeLabel.textContent = "Chế độ tối";
      }
    }

    themeToggleBtn.addEventListener("click", () => {
      htmlEl.classList.toggle("dark");
      const isDark = htmlEl.classList.contains("dark");
      localStorage.setItem("toan10_theme", isDark ? "dark" : "light");
      themeLabel.textContent = isDark ? "Chế độ sáng" : "Chế độ tối";
    });

    // ==================== SIDEBAR & MOBILE DRAWER ====================
    const sidebar = document.getElementById("sidebar");
    const backdrop = document.getElementById("sidebar-backdrop");
    const mobileMenuBtn = document.getElementById("mobile-menu-btn");

    function openMobileSidebar() {
      sidebar.classList.remove("-translate-x-full");
      backdrop.classList.remove("hidden");
    }

    function closeMobileSidebar() {
      sidebar.classList.add("-translate-x-full");
      backdrop.classList.add("hidden");
    }

    mobileMenuBtn.addEventListener("click", openMobileSidebar);
    backdrop.addEventListener("click", closeMobileSidebar);

    document.getElementById("lesson-search").addEventListener("input", (e) => {
      state.searchQuery = e.target.value.trim().toLowerCase();
      renderSidebar();
    });

    function renderSidebar() {
      const nav = document.getElementById("sidebar-nav");
      nav.innerHTML = "";

      CURRICULUM_DATA.forEach((chap) => {
        // Lọc bài học theo ô tìm kiếm
        const filteredLessons = chap.lessons.filter(
          (l) =>
            l.title.toLowerCase().includes(state.searchQuery) ||
            l.number.toLowerCase().includes(state.searchQuery) ||
            chap.title.toLowerCase().includes(state.searchQuery)
        );

        if (state.searchQuery && filteredLessons.length === 0) return;

        const isExpanded = state.searchQuery ? true : !!state.expandedChapters[chap.id];

        const chapEl = document.createElement("div");
        chapEl.className = "rounded-2xl overflow-hidden";

        // Nút tiêu đề chương
        const chapBtn = document.createElement("button");
        chapBtn.className =
          "w-full flex items-center justify-between gap-2 px-3 py-2.5 text-left rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800/80 transition font-semibold text-xs text-slate-700 dark:text-slate-200";
        chapBtn.innerHTML = `
          <span class="leading-snug">${chap.title}</span>
          <i data-lucide="chevron-down" class="w-4 h-4 shrink-0 text-slate-400 transition-transform duration-200 ${isExpanded ? "rotate-180" : ""}"></i>
        `;
        chapBtn.addEventListener("click", () => {
          state.expandedChapters[chap.id] = !state.expandedChapters[chap.id];
          renderSidebar();
        });
        chapEl.appendChild(chapBtn);

        // Danh sách bài học trong chương
        if (isExpanded) {
          const listEl = document.createElement("div");
          listEl.className = "mt-1 pl-2 space-y-1";

          filteredLessons.forEach((lesson) => {
            const isActive = lesson.id === state.currentLessonId;
            const itemBtn = document.createElement("button");
            itemBtn.className = `w-full flex items-center justify-between gap-2 px-3 py-2.5 rounded-xl text-left text-sm transition-all ${
              isActive
                ? "bg-brand-600 text-white font-semibold shadow-sm shadow-brand-600/25"
                : "text-slate-600 dark:text-slate-300 hover:bg-sky-50 dark:hover:bg-slate-800/60"
            }`;

            itemBtn.innerHTML = `
              <div class="min-w-0 flex-1">
                <div class="text-[11px] uppercase tracking-wider ${isActive ? "text-brand-100" : "text-slate-400 dark:text-slate-500"} font-bold">
                  ${lesson.number}
                </div>
                <div class="truncate">${lesson.title}</div>
              </div>
              ${
                lesson.isFull
                  ? `<span class="shrink-0 w-2 h-2 rounded-full ${isActive ? "bg-white" : "bg-emerald-500"}" title="Đầy đủ nội dung tương tác"></span>`
                  : `<span class="shrink-0 text-[10px] px-1.5 py-0.5 rounded-md ${isActive ? "bg-white/20 text-white" : "bg-slate-100 dark:bg-slate-800 text-slate-400"}">Tóm tắt</span>`
              }
            `;

            itemBtn.addEventListener("click", () => {
              state.currentLessonId = lesson.id;
              closeMobileSidebar();
              renderAll();
              window.scrollTo({ top: 0, behavior: "smooth" });
            });

            listEl.appendChild(itemBtn);
          });

          chapEl.appendChild(listEl);
        }

        nav.appendChild(chapEl);
      });

      lucide.createIcons();
    }

    // ==================== HEADER BÀI HỌC & TABS ====================
    function renderLessonHeader() {
      const { chapter, lesson } = findLessonById(state.currentLessonId);
      const headerEl = document.getElementById("lesson-header");

      headerEl.innerHTML = `
        <div class="flex flex-wrap items-center gap-2 text-xs font-medium text-brand-600 dark:text-brand-400 mb-2">
          <span class="px-2.5 py-1 rounded-lg bg-brand-50 dark:bg-brand-950/80 border border-brand-200/70 dark:border-brand-800/60">
            ${chapter.title}
          </span>
          <span>/</span>
          <span class="text-slate-500 dark:text-slate-400">${lesson.number}</span>
        </div>
        <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">
          ${lesson.number}: ${lesson.title}
        </h2>
        ${
          lesson.objectives
            ? `<div class="mt-4 p-4 rounded-2xl bg-gradient-to-r from-sky-50 to-indigo-50/60 dark:from-slate-900 dark:to-slate-800/80 border border-sky-200/70 dark:border-slate-800">
                <div class="flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-brand-700 dark:text-brand-300 mb-2">
                  <i data-lucide="target" class="w-4 h-4"></i>
                  <span>Mục tiêu bài học</span>
                </div>
                <ul class="grid sm:grid-cols-2 gap-2 text-sm text-slate-700 dark:text-slate-300">
                  ${lesson.objectives
                    .map(
                      (obj) => `
                    <li class="flex items-start gap-2">
                      <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-500 shrink-0 mt-0.5"></i>
                      <span>${obj}</span>
                    </li>`
                    )
                    .join("")}
                </ul>
              </div>`
            : ""
        }
      `;
    }

    function updateTabButtons() {
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        const isCurrent = btn.dataset.tab === state.currentTab;
        if (isCurrent) {
          btn.className =
            "tab-btn flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl text-xs sm:text-sm font-bold bg-brand-600 text-white shadow-sm shadow-brand-600/20 transition-all";
        } else {
          btn.className =
            "tab-btn flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all";
        }
      });
    }

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.currentTab = btn.dataset.tab;
        updateTabButtons();
        renderTabContent();
      });
    });

    // ==================== RENDER NỘI DUNG 3 TABS ====================
    function renderPlaceholderLesson(lesson) {
      return `
        <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-6 sm:p-8 shadow-xs">
          <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-100 dark:bg-amber-950/70 text-amber-800 dark:text-amber-300 text-xs font-semibold mb-4">
            <i data-lucide="clock" class="w-3.5 h-3.5"></i>
            <span>Chuyên đề tóm tắt kiến thức cốt lõi</span>
          </div>
          <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-3">Tóm tắt trọng tâm ${lesson.number}: ${lesson.title}</h3>
          <div class="p-5 rounded-2xl bg-sky-50/80 dark:bg-slate-800/80 border-l-4 border-brand-500 text-slate-700 dark:text-slate-200 leading-relaxed mb-6">
            ${lesson.summary}
          </div>
          <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pt-4 border-t border-slate-100 dark:border-slate-800">
            <p class="text-sm text-slate-500 dark:text-slate-400">
              Hệ thống bài tập phân dạng và đề tự luyện 2025 cho bài này đang được biên soạn bổ sung. Bạn có thể trải nghiệm đầy đủ 3 tab tương tác ở <strong>Chương I (Bài 1 & Bài 2)</strong>.
            </p>
            <button onclick="switchToLesson('bai1')" class="shrink-0 px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold transition flex items-center gap-2">
              <span>Học ngay Bài 1</span>
              <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      `;
    }

    window.switchToLesson = function (id) {
      state.currentLessonId = id;
      state.currentTab = "theory";
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    // TAB 1: LÝ THUYẾT & VÍ DỤ MINH HỌA
    function renderTheoryTab(lesson) {
      if (!lesson.isFull) return renderPlaceholderLesson(lesson);

      const blockStyles = {
        definition: {
          wrap: "bg-sky-50/80 dark:bg-sky-950/30 border-sky-200 dark:border-sky-800/70",
          badge: "bg-brand-600 text-white",
          icon: "bookmark"
        },
        theorem: {
          wrap: "bg-indigo-50/80 dark:bg-indigo-950/30 border-indigo-200 dark:border-indigo-800/70",
          badge: "bg-indigo-600 text-white",
          icon: "award"
        },
        note: {
          wrap: "bg-amber-50/80 dark:bg-amber-950/25 border-amber-200 dark:border-amber-800/60",
          badge: "bg-amber-500 text-white",
          icon: "lightbulb"
        }
      };

      return `
        <div class="space-y-8">
          ${lesson.theory
            .map(
              (sec) => `
            <section class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-5 sm:p-7 shadow-xs">
              <h3 class="text-lg sm:text-xl font-bold text-slate-900 dark:text-white pb-3 mb-5 border-b border-slate-100 dark:border-slate-800 flex items-center gap-2.5">
                <span class="w-2 h-6 rounded-full bg-brand-500 inline-block"></span>
                <span>${sec.heading}</span>
              </h3>

              <!-- Khung kiến thức trọng tâm -->
              <div class="space-y-4">
                ${sec.blocks
                  .map((b) => {
                    const st = blockStyles[b.type] || blockStyles.definition;
                    return `
                    <div class="p-4 sm:p-5 rounded-2xl border ${st.wrap}">
                      <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-bold ${st.badge} mb-2.5">
                        <i data-lucide="${st.icon}" class="w-3.5 h-3.5"></i>
                        <span>${b.title}</span>
                      </div>
                      <div class="text-sm sm:text-base text-slate-800 dark:text-slate-200 leading-relaxed">
                        ${b.content}
                      </div>
                    </div>`;
                  })
                  .join("")}
              </div>

              <!-- Ví dụ minh họa -->
              ${
                sec.examples && sec.examples.length > 0
                  ? `<div class="mt-6 space-y-4">
                      ${sec.examples
                        .map(
                          (ex) => `
                        <div class="rounded-2xl border border-slate-200 dark:border-slate-700/80 overflow-hidden bg-slate-50/60 dark:bg-slate-800/40">
                          <div class="px-4 py-3 bg-slate-100/90 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700/80 flex items-center gap-2 font-bold text-sm text-brand-700 dark:text-brand-300">
                            <i data-lucide="pen-tool" class="w-4 h-4"></i>
                            <span>${ex.title}</span>
                          </div>
                          <div class="p-4 sm:p-5 space-y-3 text-sm sm:text-base">
                            <div class="font-medium text-slate-900 dark:text-slate-100 leading-relaxed">
                              ${ex.problem}
                            </div>
                            <div class="pt-3 border-t border-dashed border-slate-200 dark:border-slate-700">
                              <div class="text-xs font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 mb-1.5 flex items-center gap-1.5">
                                <i data-lucide="check-circle" class="w-3.5 h-3.5"></i>
                                <span>Lời giải chi tiết</span>
                              </div>
                              <div class="text-slate-700 dark:text-slate-300 leading-relaxed">
                                ${ex.solution}
                              </div>
                            </div>
                          </div>
                        </div>`
                        )
                        .join("")}
                    </div>`
                  : ""
              }
            </section>`
            )
            .join("")}
        </div>
      `;
    }

    // TAB 2: PHÂN DẠNG BÀI TẬP
    function renderTypesTab(lesson) {
      if (!lesson.isFull) return renderPlaceholderLesson(lesson);

      return `
        <div class="space-y-7">
          ${lesson.problemTypes
            .map(
              (pt, tIdx) => `
            <section class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-5 sm:p-7 shadow-xs">
              <div class="flex items-start gap-3 mb-4">
                <div class="w-9 h-9 rounded-xl bg-brand-100 dark:bg-brand-900/60 text-brand-700 dark:text-brand-300 font-extrabold flex items-center justify-center shrink-0">
                  ${tIdx + 1}
                </div>
                <h3 class="text-lg sm:text-xl font-bold text-slate-900 dark:text-white pt-1">
                  ${pt.typeTitle}
                </h3>
              </div>

              <!-- Khung phương pháp giải -->
              <div class="p-4 sm:p-5 rounded-2xl bg-gradient-to-r from-sky-50 to-blue-50/60 dark:from-sky-950/40 dark:to-slate-800/60 border border-sky-200 dark:border-sky-800/60 mb-6">
                <div class="flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-brand-700 dark:text-brand-300 mb-2">
                  <i data-lucide="compass" class="w-4 h-4"></i>
                  <span>Phương pháp giải</span>
                </div>
                <div class="text-sm sm:text-base text-slate-800 dark:text-slate-200 leading-relaxed">
                  ${pt.method}
                </div>
              </div>

              <!-- Danh sách bài tập mẫu -->
              <div class="space-y-4">
                ${pt.exercises
                  .map((ex, eIdx) => {
                    const solId = `sol_${lesson.id}_${tIdx}_${eIdx}`;
                    return `
                    <div class="p-4 sm:p-5 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/30">
                      <div class="text-sm sm:text-base text-slate-900 dark:text-slate-100 leading-relaxed mb-4">
                        ${ex.question}
                      </div>

                      <button
                        type="button"
                        onclick="toggleExerciseSolution('${solId}', this)"
                        class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-400 border border-brand-200 dark:border-brand-800 hover:bg-brand-50 dark:hover:bg-slate-700 transition shadow-2xs"
                      >
                        <i data-lucide="eye" class="w-4 h-4"></i>
                        <span>Xem lời giải</span>
                      </button>

                      <div id="${solId}" class="hidden mt-4 pt-4 border-t border-slate-200 dark:border-slate-700 text-sm sm:text-base text-slate-700 dark:text-slate-300 leading-relaxed bg-emerald-50/50 dark:bg-emerald-950/20 p-4 rounded-xl">
                        <div class="text-xs font-bold uppercase tracking-wider text-emerald-700 dark:text-emerald-400 mb-1.5">
                          Hướng dẫn giải chi tiết:
                        </div>
                        ${ex.solution}
                      </div>
                    </div>`;
                  })
                  .join("")}
              </div>
            </section>`
            )
            .join("")}
        </div>
      `;
    }

    window.toggleExerciseSolution = function (solId, btnEl) {
      const box = document.getElementById(solId);
      const isHidden = box.classList.contains("hidden");
      if (isHidden) {
        box.classList.remove("hidden");
        btnEl.innerHTML = `<i data-lucide="eye-off" class="w-4 h-4"></i><span>Ẩn lời giải</span>`;
        renderMath(box);
      } else {
        box.classList.add("hidden");
        btnEl.innerHTML = `<i data-lucide="eye" class="w-4 h-4"></i><span>Xem lời giải</span>`;
      }
      lucide.createIcons();
    };

    // TAB 3: ĐỀ TỰ LUYỆN TƯƠNG TÁC (CẤU TRÚC ĐỀ THI MỚI 2025)
    function renderQuizTab(lesson) {
      if (!lesson.isFull) return renderPlaceholderLesson(lesson);

      const qData = lesson.quiz;
      const session = getQuizSession(lesson.id);
      const optionLetters = ["A", "B", "C", "D"];

      return `
        <div class="space-y-8">

          <!-- Bảng kết quả sau khi nộp bài -->
          ${
            session.submitted && session.scoreInfo
              ? `<div class="p-6 rounded-3xl bg-gradient-to-br from-brand-600 to-indigo-700 text-white shadow-lg shadow-brand-600/20 fade-in">
                  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/15 text-xs font-semibold mb-2">
                        <i data-lucide="award" class="w-4 h-4"></i>
                        <span>Kết quả tự luyện (Phần I & II)</span>
                      </div>
                      <h3 class="text-2xl sm:text-3xl font-extrabold">
                        Điểm trắc nghiệm: ${session.scoreInfo.autoScore} / 7.0 điểm
                      </h3>
                      <p class="text-brand-100 text-sm mt-1">
                        Phần I đúng <strong>${session.scoreInfo.p1Correct}/${qData.part1.length}</strong> câu • Phần II đúng <strong>${session.scoreInfo.p2Correct}/${qData.part2.length}</strong> câu • Phần III (3.0 điểm) hãy đối chiếu đáp án mẫu bên dưới.
                      </p>
                    </div>
                    <button
                      type="button"
                      onclick="resetQuiz('${lesson.id}')"
                      class="px-5 py-3 rounded-2xl bg-white text-brand-700 hover:bg-brand-50 font-bold text-sm transition flex items-center justify-center gap-2 shrink-0 shadow-sm"
                    >
                      <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                      <span>Làm lại đề này</span>
                    </button>
                  </div>
                </div>`
              : ""
          }

          <!-- PHẦN I: TRẮC NGHIỆM NHIỀU PHƯƠNG ÁN LỰA CHỌN -->
          <section class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-5 sm:p-7 shadow-xs">
            <div class="flex flex-wrap items-center justify-between gap-2 pb-4 mb-6 border-b border-slate-100 dark:border-slate-800">
              <div>
                <h3 class="text-lg font-extrabold text-slate-900 dark:text-white">
                  PHẦN I. Trắc nghiệm nhiều phương án lựa chọn
                </h3>
                <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">
                  Thí sinh trả lời từ câu 1 đến câu ${qData.part1.length}. Mỗi câu hỏi thí sinh chỉ chọn một phương án.
                </p>
              </div>
              <span class="px-3 py-1 rounded-xl bg-brand-50 dark:bg-brand-950 text-brand-700 dark:text-brand-300 text-xs font-bold">
                4.0 điểm
              </span>
            </div>

            <div class="space-y-6">
              ${qData.part1
                .map((q, idx) => {
                  const userChoice = session.part1Answers[q.id];
                  return `
                  <div class="p-4 sm:p-5 rounded-2xl border border-slate-200/90 dark:border-slate-800 bg-slate-50/40 dark:bg-slate-800/20">
                    <div class="font-semibold text-slate-900 dark:text-white mb-4 leading-relaxed">
                      <span class="text-brand-600 dark:text-brand-400 font-extrabold">Câu ${idx + 1}:</span> ${q.question}
                    </div>

                    <div class="grid sm:grid-cols-2 gap-2.5">
                      ${q.options
                        .map((opt, optIdx) => {
                          let btnStyle =
                            "border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 hover:border-brand-400 dark:hover:border-brand-500 text-slate-700 dark:text-slate-200";
                          let badgeStyle =
                            "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300";

                          if (!session.submitted) {
                            if (userChoice === optIdx) {
                              btnStyle =
                                "border-brand-600 bg-brand-50/90 dark:bg-brand-950/60 dark:border-brand-500 text-brand-900 dark:text-brand-100 ring-2 ring-brand-500/20";
                              badgeStyle = "bg-brand-600 text-white";
                            }
                          } else {
                            if (optIdx === q.correct) {
                              btnStyle =
                                "border-emerald-500 bg-emerald-50 dark:bg-emerald-950/50 text-emerald-900 dark:text-emerald-100 ring-2 ring-emerald-500/20";
                              badgeStyle = "bg-emerald-600 text-white";
                            } else if (userChoice === optIdx && userChoice !== q.correct) {
                              btnStyle =
                                "border-rose-500 bg-rose-50 dark:bg-rose-950/50 text-rose-900 dark:text-rose-100";
                              badgeStyle = "bg-rose-600 text-white";
                            } else {
                              btnStyle =
                                "border-slate-200 dark:border-slate-800 bg-white/60 dark:bg-slate-900/60 opacity-65";
                            }
                          }

                          return `
                          <button
                            type="button"
                            ${session.submitted ? "disabled" : ""}
                            onclick="selectPart1Option('${lesson.id}', '${q.id}', ${optIdx})"
                            class="w-full p-3 rounded-xl border text-left text-sm transition-all flex items-center gap-3 ${btnStyle}"
                          >
                            <span class="w-7 h-7 rounded-lg font-bold text-xs flex items-center justify-center shrink-0 ${badgeStyle}">
                              ${optionLetters[optIdx]}
                            </span>
                            <span class="leading-snug">${opt}</span>
                          </button>`;
                        })
                        .join("")}
                    </div>

                    ${
                      session.submitted
                        ? `<div class="mt-4 p-3.5 rounded-xl bg-sky-50/90 dark:bg-slate-800/90 border border-sky-200/80 dark:border-slate-700 text-xs sm:text-sm text-slate-700 dark:text-slate-300">
                            <span class="font-bold text-brand-700 dark:text-brand-300">Giải thích:</span> ${q.explanation}
                          </div>`
                        : ""
                    }
                  </div>`;
                })
                .join("")}
            </div>
          </section>

          <!-- PHẦN II: TRẮC NGHIỆM TRẢ LỜI NGẮN -->
          <section class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-5 sm:p-7 shadow-xs">
            <div class="flex flex-wrap items-center justify-between gap-2 pb-4 mb-6 border-b border-slate-100 dark:border-slate-800">
              <div>
                <h3 class="text-lg font-extrabold text-slate-900 dark:text-white">
                  PHẦN II. Trắc nghiệm trả lời ngắn
                </h3>
                <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">
                  Thí sinh điền đáp số bằng số (số nguyên hoặc số thập phân) vào ô tương ứng.
                </p>
              </div>
              <span class="px-3 py-1 rounded-xl bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 text-xs font-bold">
                3.0 điểm
              </span>
            </div>

            <div class="space-y-5">
              ${qData.part2
                .map((q, idx) => {
                  const val = session.part2Answers[q.id] || "";
                  const isCorrect =
                    session.submitted &&
                    normalizeNumberAnswer(val) === normalizeNumberAnswer(q.answer);

                  return `
                  <div class="p-4 sm:p-5 rounded-2xl border border-slate-200/90 dark:border-slate-800 bg-slate-50/40 dark:bg-slate-800/20">
                    <div class="font-semibold text-slate-900 dark:text-white mb-4 leading-relaxed">
                      <span class="text-indigo-600 dark:text-indigo-400 font-extrabold">Câu ${idx + 1}:</span> ${q.question}
                    </div>

                    <div class="flex flex-wrap items-center gap-3">
                      <label class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                        Đáp số của bạn:
                      </label>
                      <input
                        type="text"
                        inputmode="decimal"
                        placeholder="Nhập số..."
                        value="${val}"
                        ${session.submitted ? "disabled" : ""}
                        oninput="updatePart2Input('${lesson.id}', '${q.id}', this.value)"
                        class="w-40 px-3.5 py-2 rounded-xl border text-sm font-bold outline-none transition ${
                          !session.submitted
                            ? "border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 focus:border-brand-500"
                            : isCorrect
                            ? "border-emerald-500 bg-emerald-50 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-200"
                            : "border-rose-500 bg-rose-50 dark:bg-rose-950/60 text-rose-800 dark:text-rose-200"
                        }"
                      />
                      <span class="text-xs text-slate-500 dark:text-slate-400">(${q.unit})</span>

                      ${
                        session.submitted
                          ? isCorrect
                            ? `<span class="inline-flex items-center gap-1 text-xs font-bold text-emerald-600 dark:text-emerald-400"><i data-lucide="check-circle-2" class="w-4 h-4"></i> Chính xác!</span>`
                            : `<span class="inline-flex items-center gap-1 text-xs font-bold text-rose-600 dark:text-rose-400"><i data-lucide="x-circle" class="w-4 h-4"></i> Đáp án đúng: ${q.answer}</span>`
                          : ""
                      }
                    </div>

                    ${
                      session.submitted
                        ? `<div class="mt-4 p-3.5 rounded-xl bg-sky-50/90 dark:bg-slate-800/90 border border-sky-200/80 dark:border-slate-700 text-xs sm:text-sm text-slate-700 dark:text-slate-300">
                            <span class="font-bold text-brand-700 dark:text-brand-300">Hướng dẫn:</span> ${q.explanation}
                          </div>`
                        : ""
                    }
                  </div>`;
                })
                .join("")}
            </div>
          </section>

          <!-- PHẦN III: TỰ LUẬN -->
          <section class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-5 sm:p-7 shadow-xs">
            <div class="flex flex-wrap items-center justify-between gap-2 pb-4 mb-6 border-b border-slate-100 dark:border-slate-800">
              <div>
                <h3 class="text-lg font-extrabold text-slate-900 dark:text-white">
                  PHẦN III. Tự luận
                </h3>
                <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">
                  Trình bày lời giải ra giấy nháp hoặc khung ghi chú bên dưới, sau đó bấm "Nộp bài" để xem biểu điểm và đáp án chi tiết.
                </p>
              </div>
              <span class="px-3 py-1 rounded-xl bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 text-xs font-bold">
                3.0 điểm
              </span>
            </div>

            <div class="space-y-6">
              ${qData.part3
                .map((q, idx) => {
                  const noteVal = session.part3Notes[q.id] || "";
                  return `
                  <div class="p-4 sm:p-5 rounded-2xl border border-slate-200/90 dark:border-slate-800 bg-slate-50/40 dark:bg-slate-800/20">
                    <div class="font-semibold text-slate-900 dark:text-white mb-3 leading-relaxed">
                      <span class="text-emerald-600 dark:text-emerald-400 font-extrabold">Câu ${idx + 1}:</span> ${q.question}
                    </div>

                    <textarea
                      rows="3"
                      placeholder="Ghi chú hướng giải hoặc đáp số nháp của bạn tại đây..."
                      ${session.submitted ? "disabled" : ""}
                      oninput="updatePart3Note('${lesson.id}', '${q.id}', this.value)"
                      class="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm text-slate-800 dark:text-slate-200 outline-none focus:border-brand-500 transition"
                    >${noteVal}</textarea>

                    ${
                      session.submitted
                        ? `<div class="mt-4 p-4 rounded-xl bg-emerald-50/70 dark:bg-emerald-950/25 border border-emerald-200 dark:border-emerald-800/60 text-sm text-slate-800 dark:text-slate-200 leading-relaxed">
                            <div class="text-xs font-bold uppercase tracking-wider text-emerald-700 dark:text-emerald-400 mb-2 flex items-center gap-1.5">
                              <i data-lucide="file-check" class="w-4 h-4"></i>
                              <span>Hướng dẫn chấm & Lời giải chi tiết</span>
                            </div>
                            ${q.rubric}
                          </div>`
                        : ""
                    }
                  </div>`;
                })
                .join("")}
            </div>
          </section>

          <!-- Thanh hành động Nộp bài / Làm lại -->
          <div class="flex flex-wrap items-center justify-center gap-4 pt-2">
            ${
              !session.submitted
                ? `<button
                    type="button"
                    onclick="submitQuiz('${lesson.id}')"
                    class="px-8 py-3.5 rounded-2xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-700 hover:to-indigo-700 text-white font-bold text-base shadow-lg shadow-brand-600/25 transition transform hover:-translate-y-0.5 flex items-center gap-2.5"
                  >
                    <i data-lucide="send" class="w-5 h-5"></i>
                    <span>Nộp bài & Chấm điểm</span>
                  </button>`
                : `<button
                    type="button"
                    onclick="resetQuiz('${lesson.id}')"
                    class="px-7 py-3.5 rounded-2xl bg-slate-800 dark:bg-slate-700 hover:bg-slate-900 dark:hover:bg-slate-600 text-white font-bold text-sm transition flex items-center gap-2"
                  >
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    <span>Làm lại bài kiểm tra</span>
                  </button>`
            }
          </div>

        </div>
      `;
    }

    // ==================== XỬ LÝ TƯƠNG TÁC ĐỀ TỰ LUYỆN ====================
    function normalizeNumberAnswer(str) {
      if (!str) return "";
      return str.toString().trim().replace(",", ".");
    }

    window.selectPart1Option = function (lessonId, questionId, optionIdx) {
      const session = getQuizSession(lessonId);
      if (session.submitted) return;
      session.part1Answers[questionId] = optionIdx;
      renderTabContent();
    };

    window.updatePart2Input = function (lessonId, questionId, value) {
      const session = getQuizSession(lessonId);
      if (session.submitted) return;
      session.part2Answers[questionId] = value;
    };

    window.updatePart3Note = function (lessonId, questionId, value) {
      const session = getQuizSession(lessonId);
      if (session.submitted) return;
      session.part3Notes[questionId] = value;
    };

    window.submitQuiz = function (lessonId) {
      const { lesson } = findLessonById(lessonId);
      const qData = lesson.quiz;
      const session = getQuizSession(lessonId);

      // Tính điểm Phần I (tối đa 4.0 điểm)
      let p1Correct = 0;
      qData.part1.forEach((q) => {
        if (session.part1Answers[q.id] === q.correct) p1Correct++;
      });
      const p1Score = (p1Correct / qData.part1.length) * 4.0;

      // Tính điểm Phần II (tối đa 3.0 điểm)
      let p2Correct = 0;
      qData.part2.forEach((q) => {
        const userAns = normalizeNumberAnswer(session.part2Answers[q.id]);
        const rightAns = normalizeNumberAnswer(q.answer);
        if (userAns !== "" && userAns === rightAns) p2Correct++;
      });
      const p2Score = (p2Correct / qData.part2.length) * 3.0;

      const autoScore = (Math.round((p1Score + p2Score) * 100) / 100).toFixed(2);

      session.submitted = true;
      session.scoreInfo = {
        p1Correct,
        p2Correct,
        autoScore
      };

      renderTabContent();
      window.scrollTo({ top: 180, behavior: "smooth" });
      showToast(`Đã nộp bài! Bạn đạt ${autoScore}/7.0 điểm phần trắc nghiệm.`);
    };

    window.resetQuiz = function (lessonId) {
      state.quizState[lessonId] = {
        part1Answers: {},
        part2Answers: {},
        part3Notes: {},
        submitted: false,
        scoreInfo: null
      };
      renderTabContent();
      showToast("Đã làm mới bài tự luyện. Chúc bạn làm bài tốt!");
    };

    // ==================== RENDER TỔNG THỂ ====================
    function renderTabContent() {
      const { lesson } = findLessonById(state.currentLessonId);
      const container = document.getElementById("tab-content");

      // Re-trigger animation
      container.classList.remove("fade-in");
      void container.offsetWidth;
      container.classList.add("fade-in");

      if (state.currentTab === "theory") {
        container.innerHTML = renderTheoryTab(lesson);
      } else if (state.currentTab === "types") {
        container.innerHTML = renderTypesTab(lesson);
      } else {
        container.innerHTML = renderQuizTab(lesson);
      }

      lucide.createIcons();
      renderMath(container);
    }

    function renderAll() {
      renderSidebar();
      renderLessonHeader();
      updateTabButtons();
      renderTabContent();
      renderMath(document.getElementById("lesson-header"));
    }

    // Khởi chạy khi tải xong DOM & KaTeX
    document.addEventListener("DOMContentLoaded", () => {
      initTheme();
      renderAll();
    });

    window.addEventListener("load", () => {
      renderMath(document.body);
    });
  </script>
</body>
</html>
